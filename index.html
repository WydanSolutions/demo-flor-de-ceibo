/* ───────── tablero de redes + cruce redes/ventas ───────── */
function mktTablero(){
  const mesAct = hoyISO().slice(0,7);
  const dPrev=new Date(); dPrev.setMonth(dPrev.getMonth()-1); const mesPrev=iso(dPrev).slice(0,7);
  const segTot = seguidoresTotal();
  const segPrev = suma(REDES.map(r=>(T('redes').find(x=>x.red===r.id && x.mes===mesPrev)||{}).seguidores||0));
  const alc = alcanceMes();
  const inter = suma(REDES.map(r=>Redes.ultimo(r.id).interacciones||0));
  const posts = T('posts').filter(p=>p.estado==='publicado');
  const ventasRedes = posts.reduce((s,p)=>s+p.ventas,0);
  const montoRedes = posts.reduce((s,p)=>s+p.monto,0);

  alDibujar(()=>{
    const meses = [...new Set(T('redes').map(r=>r.mes))].sort();
    graf('g-seg',{type:'line', data:{labels:meses.map(m=>MES_NOM[+m.slice(5,7)-1].slice(0,3)),
      datasets:REDES.map(r=>({label:r.nombre, borderColor:r.color, backgroundColor:r.color+'22', tension:.35,
        pointRadius:0, borderWidth:2.4, fill:false,
        data:meses.map(m=>(T('redes').find(x=>x.red===r.id && x.mes===m)||{}).seguidores||0)}))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle'}}},
        scales:{x:{grid:{display:false}},y:{border:{display:false},grid:{color:'#F0E8DE'}}}}});
    // alcance vs ventas atribuidas, por semana
    const sem=[], alcS=[], venS=[];
    for(let i=7;i>=0;i--){ const f=masDias(hoyISO(),-(i*7+6)), t=masDias(hoyISO(),-i*7);
      sem.push(dm(t));
      alcS.push(suma(posts.filter(p=>p.fecha>=f&&p.fecha<=t),p=>p.alcance));
      venS.push(suma(posts.filter(p=>p.fecha>=f&&p.fecha<=t),p=>p.monto)); }
    graf('g-cruce',{data:{labels:sem, datasets:[
      {type:'bar', label:'Alcance en redes', data:alcS, backgroundColor:'#E3D6C6', borderRadius:5, yAxisID:'y'},
      {type:'line', label:'Ventas que vinieron de ahí', data:venS, borderColor:'#C62B22', backgroundColor:'#C62B2220',
       tension:.35, borderWidth:2.6, pointRadius:3, pointBackgroundColor:'#C62B22', yAxisID:'y1', fill:true}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle'}},
          tooltip:{callbacks:{label:c=>c.dataset.yAxisID==='y1'? 'Ventas: '+money(c.parsed.y): 'Alcance: '+nf0.format(c.parsed.y)}}},
        scales:{x:{grid:{display:false}},
          y:{position:'left',border:{display:false},grid:{color:'#F0E8DE'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}},
          y1:{position:'right',border:{display:false},grid:{display:false},ticks:{callback:v=>moneyK(v)}}}}});
  });

  const ranking = posts.slice().sort((a,b)=>b.monto-a.monto);
  return `
  <div class="aviso" style="margin-bottom:16px"><span class="em">◐</span><div>
    <b>Los números de redes de esta demostración están simulados</b> (del orden de los reales: ~1.850 seguidores en Instagram).
    Para que se actualicen solos hay que conectar las cuentas de Instagram, Facebook y TikTok — eso es la segunda etapa.
    Lo que sí es real es <b>cómo se cruzan con las ventas</b>: eso sale de tus propios datos.</div></div>

  <div class="grid g4">
    ${kpi({tit:'Seguidores', val:nf0.format(segTot), clase:'k-ceibo',
      pie: delta(segPrev? (segTot/segPrev-1)*100:null, 'este mes')})}
    ${kpi({tit:'Alcance del mes', val:nf0.format(alc), clase:'k-info',
      pie:`<span>personas distintas que te vieron</span>`})}
    ${kpi({tit:'Interacciones', val:nf0.format(inter), clase:'k-oliva',
      pie:`<span>${alc?nf1.format(inter/alc*100):0}% de los que te ven reaccionan</span>`})}
    ${kpi({tit:'Ventas que vinieron de redes', val:money(montoRedes),
      pie:`<span>${ventasRedes} ventas atribuidas</span>`})}
  </div>

  <div class="grid g3 mt">
    ${REDES.map(r=>{ const u=Redes.ultimo(r.id);
      const prev=(T('redes').find(x=>x.red===r.id && x.mes===mesPrev)||{});
      const cre = prev.seguidores? (u.seguidores/prev.seguidores-1)*100 : 0;
      const pr = posts.filter(p=>p.red===r.id);
      return `<div class="card">
        <div class="h-fila"><div><h3>${esc(r.nombre)}</h3>
          <div class="sub">${pr.length} publicaciones en 2 meses</div></div>
          <div class="acc"><span class="chip" style="background:${r.color}18;color:${r.color}">${r.em}</span></div></div>
        <div class="val serif" style="font-size:30px">${nf0.format(u.seguidores||0)}</div>
        <div class="pie mini" style="margin:2px 0 12px">seguidores · ${delta(cre,'')}</div>
        <div class="lista">
          <div class="it"><div class="txt"><span>Alcance del mes</span><b>${nf0.format(u.alcance||0)}</b></div></div>
          <div class="it"><div class="txt"><span>Interacciones</span><b>${nf0.format(u.interacciones||0)}</b></div></div>
          <div class="it"><div class="txt"><span>Ventas atribuidas</span><b>${money(suma(pr,p=>p.monto))}</b></div></div>
        </div></div>`;}).join('')}
  </div>

  <div class="grid g2 mt">
    ${card('Cómo crecen tus redes', `<div class="graf alto"><canvas id="g-seg"></canvas></div>`,{sub:'Seguidores, últimos 12 meses'})}
    ${card('Lo que publicás ¿vende?', `<div class="graf alto"><canvas id="g-cruce"></canvas></div>
      <div class="mini" style="margin-top:8px">Barras: cuánta gente te vio. Línea roja: la plata que entró por esas publicaciones.</div>`,
      {sub:'Semana a semana'})}
  </div>

  ${card('Qué contenido te trae plata', `
    <div class="tabla-wrap"><table class="t resp"><thead><tr>
      <th>Publicación</th><th>Red</th><th>Fecha</th><th class="der">Alcance</th><th class="der">Interacciones</th>
      <th class="der">Ventas</th><th class="der">Facturó</th><th>Rendimiento</th></tr></thead><tbody>
      ${ranking.map(p=>{ const red=REDES.find(r=>r.id===p.red)||{};
        const efi = p.alcance? p.monto/p.alcance*1000 : 0;
        const mx = Math.max(...ranking.map(x=>x.alcance?x.monto/x.alcance*1000:0),1);
        return `<tr>
        <td data-l="Publicación" class="principal"><b class="nom">${esc(p.titulo)}</b>
          <div class="sub2">${esc(p.tipo)}</div></td>
        <td data-l="Red"><span class="chip" style="background:${red.color}18;color:${red.color}">${esc(red.nombre||'')}</span></td>
        <td data-l="Fecha">${dmy(p.fecha)}</td>
        <td data-l="Alcance" class="der">${nf0.format(p.alcance)}</td>
        <td data-l="Interacciones" class="der">${nf0.format(p.interacciones)}</td>
        <td data-l="Ventas" class="der">${p.ventas||'—'}</td>
        <td data-l="Facturó" class="der"><b>${p.monto?money(p.monto):'—'}</b></td>
        <td data-l="Rendimiento" style="min-width:120px">
          <div class="barra ${efi>mx*0.6?'ceibo':''}"><i style="width:${Math.round(efi/mx*100)}%"></i></div>
          <span class="sub2">${money(efi)} por cada 1.000 vistas</span></td>
      </tr>`;}).join('')}
    </tbody></table></div>`, {clase:'mt', sub:'Publicaciones ordenadas por lo que facturaron'})}

  <div class="grid g2 mt">
    ${card('Sugerencias', sugerencias().map(s=>`
      <div class="idea-card" style="margin-bottom:9px"><div class="em">${s.em}</div>
        <div style="flex:1"><b>${esc(s.tit)}</b><p>${s.txt}</p></div>
        ${s.accion?`<button class="btn chico sec" onclick="${s.accion}">${esc(s.btn)}</button>`:''}</div>`).join(''))}
    ${card('Lo que viene', `<div class="lista">
      ${T('eventos').filter(e=>e.fecha>=hoyISO()).sort((a,b)=>a.fecha<b.fecha?-1:1).map(e=>`
        <div class="it"><span class="pun" style="background:var(--ceibo)"></span>
          <div class="txt"><b>${esc(e.nombre)}</b><span>${dmy(e.fecha)} · ${esc(e.hora)} · ${esc(e.lugar)}</span></div>
          <div class="fin"><span class="chip">${e.confirmadas}/${e.invitadas}</span></div></div>`).join('')}
      ${T('posts').filter(p=>p.estado!=='publicado').sort((a,b)=>a.fecha<b.fecha?-1:1).map(p=>`
        <div class="it"><span class="pun" style="background:var(--oliva)"></span>
          <div class="txt"><b>${esc(p.titulo)}</b><span>${dmy(p.fecha)} · ${esc(p.tipo)} en ${esc((REDES.find(r=>r.id===p.red)||{}).nombre)}</span></div>

  </div>`;
}

/* ───────── calendario de contenido y eventos ───────── */
function mktCalendario(){
  const base = ESTADO.filtros.mes || hoyISO().slice(0,7);
  const [ay,am] = base.split('-').map(Number);
  const primero = new Date(ay, am-1, 1), ultimo = new Date(ay, am, 0);
  const desplaz = primero.getDay();
  const celdas = [];
  for(let i=0;i<desplaz;i++){ const d=new Date(ay,am-1,1-(desplaz-i)); celdas.push({f:iso(d), fuera:true}); }
  for(let d=1; d<=ultimo.getDate(); d++) celdas.push({f:iso(new Date(ay,am-1,d)), fuera:false});
  while(celdas.length%7) { const d=new Date(ay,am,celdas.length-desplaz-ultimo.getDate()+1); celdas.push({f:iso(d), fuera:true}); }

  const posts = T('posts'), evs = T('eventos'), camps = T('campanas');
  const mover = n => { const d=new Date(ay,am-1+n,1); ESTADO.filtros.mes=iso(d).slice(0,7); render(); };
  window._calMover = mover;

  return `
  ${card(mesNom(base), `
    <div class="cal">
      ${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d=>`<div class="dia-nom">${d}</div>`).join('')}
      ${celdas.map(c=>{
        const ps = posts.filter(p=>p.fecha===c.f), es = evs.filter(e=>e.fecha===c.f), cs = camps.filter(x=>x.fecha===c.f);
        return `<div class="dia ${c.fuera?'fuera':''} ${c.f===hoyISO()?'hoy':''}" ondblclick="formPost('','${c.f}')">
          <div class="n">${+c.f.slice(8)}</div>
          ${es.map(e=>`<div class="ev evento" title="${esc(e.nombre)}" onclick="verEvento('${e.id}')">❖ ${esc(e.nombre)}</div>`).join('')}
          ${cs.map(x=>`<div class="ev listo" title="Campaña: ${esc(x.nombre)}" onclick="ir('marketing','whatsapp')">✆ ${esc(x.nombre)}</div>`).join('')}
          ${ps.map(p=>`<div class="ev ${p.estado}" title="${esc(p.titulo)}" onclick="formPost('${p.id}')">${esc((REDES.find(r=>r.id===p.red)||{}).em||'')} ${esc(p.titulo)}</div>`).join('')}
        </div>`;}).join('')}
    </div>
    <div class="mini" style="margin-top:12px">Doble clic en un día para agendar una publicación.
      <span class="chip" style="margin-left:8px">idea</span>
      <span class="chip info">listo para publicar</span>
      <span class="chip ok">publicado</span>
      <span class="chip mal">evento / desfile</span></div>`,
    {acc:`<button class="ico-btn" onclick="_calMover(-1)">‹</button>
          <button class="btn chico sec" onclick="ESTADO.filtros.mes='';render()">Hoy</button>
          <button class="ico-btn" onclick="_calMover(1)">›</button>
          <button class="btn chico" onclick="formPost()">＋ Publicación</button>`})}

  <div class="grid g2 mt">
    ${card('Eventos y desfiles', `<div class="lista">
      ${T('eventos').sort((a,b)=>a.fecha<b.fecha?1:-1).map(e=>{
        const fut = e.fecha>=hoyISO();
        return `<div class="it"><span class="pun" style="background:${fut?'var(--ceibo)':'var(--tinta-3)'}"></span>
        <div class="txt"><b>${esc(e.nombre)}</b><span>${dmy(e.fecha)} · ${esc(e.lugar)} · ${esc(e.tipo)}</span></div>
        <div class="fin">${fut?`<span class="chip al">en ${dias(hoyISO(),e.fecha)} días</span>`:'<span class="chip">pasado</span>'}
          <div><button class="btn chico sec" style="margin-top:5px" onclick="verEvento('${e.id}')">Ver</button></div></div></div>`;}).join('')}
    </div>
    <button class="btn sec chico" style="margin-top:12px" onclick="formEvento()">＋ Nuevo evento</button>`)}
    ${card('Ideas de contenido para este mes', `
      <div class="lista">
        ${ideasContenido().map(i=>`<div class="it"><span class="pun" style="background:var(--oliva)"></span>
          <div class="txt"><b>${esc(i.t)}</b><span>${esc(i.d)}</span></div></div>`).join('')}
      </div>
      <div class="mini" style="margin-top:10px">Salen de tus datos: lo que más se vende, lo que está quieto y lo que se viene.</div>`)}
  </div>`;
}
function ideasContenido(){
  const ideas=[];
  const top = topProductos(30,2);
  top.forEach(t=> ideas.push({t:'Reel de «'+t.p.nombre+'»', d:'Es de lo más vendido del mes ('+t.cant+' unidades). Mostralo puesto, con 3 combinaciones.'}));
  const q = quietos(60).slice(0,2);
  q.forEach(x=> ideas.push({t:'Carrusel de «'+x.p.nombre+'»', d:'No se vende hace 2 meses y tenés '+stockTotal(x.p)+' unidades. Mostralo en un look completo.'}));
  const ev = proximoEvento();
  if(ev) ideas.push({t:'Cuenta regresiva de «'+ev.nombre+'»', d:'Faltan '+dias(hoyISO(),ev.fecha)+' días. Historias con la preparación y los looks.'});
  const cum = clientasDe('cumple').length;
  if(cum) ideas.push({t:'Historia de cumpleañeras', d:cum+' clientas cumplen este mes. Un saludo público suma mucho cariño.'});
  return ideas;
}

/* ══════════════════════════════════════════════════════════════════════
   WHATSAPP · segmentos, plantillas, envío asistido y seguimiento
   ══════════════════════════════════════════════════════════════════════ */
function aplicarPlantilla(texto, c, extra){
  extra = extra||{};
  const ev = proximoEvento()||{};
  return (texto||'')
    .replace(/\{nombre\}/g, (c&&c.nombre.split(' ')[0])||'')
    .replace(/\{nombre_completo\}/g, (c&&c.nombre)||'')
    .replace(/\{talle\}/g, (c&&c.talle)||'tu talle')
    .replace(/\{cupon\}/g, extra.cupon||'10% de descuento')
    .replace(/\{coleccion\}/g, extra.coleccion||cols()[0])
    .split('{tienda}').join(extra.tienda||tienda().nombre)
    .replace(/\{local\}/g, extra.local||tienda().dir)
    .replace(/\{evento\}/g, extra.evento|| (ev.nombre? ev.nombre+' — '+dmy(ev.fecha)+' a las '+ev.hora : 'nuestro próximo evento'));
}
function burbuja(texto){
  return esc(texto).replace(/\n/g,'<br>').replace(/\{(\w+)\}/g,'<span class="wa-var">{$1}</span>');
}
function telefono(nom, texto){
  return `<div class="wa-tel"><div class="wa-pant">
    <div class="wa-barra"><span class="avatar">${inicial(nom)}</span>
      <div><b>${esc(nom)}</b><span>en línea</span></div></div>
    <div class="wa-globo mio">${burbuja(texto)}<div class="hora">${String(hoy().getHours()).padStart(2,'0')}:${String(hoy().getMinutes()).padStart(2,'0')} ✓✓</div></div>
  </div></div>`;
}

function mktWhatsApp(){
  const f = ESTADO.filtros;
  const seg = f.seg || 'dormidas', pl = f.pl || 't2';

let CL_EJEMPLO = null;
function insertarVar(v){
  const t = $('#wa-texto'); if(!t) return;
  const p = t.selectionStart||t.value.length;
  t.value = t.value.slice(0,p)+v+t.value.slice(p);
  t.focus(); t.setSelectionRange(p+v.length,p+v.length);
  t.dispatchEvent(new Event('input'));
}
function probarEnvio(){
  const t = $('#wa-texto');
  const txt = aplicarPlantilla(t?t.value:"", CL_EJEMPLO, {cupon:ESTADO.filtros.cupon});
  window._pruebaTxt = txt;
  abrirModal(`<div class="m-cab"><div><h3>Prueba</h3><div class="sub">Así se ve el mensaje ya armado</div></div>
    <div class="x"><button class="ico-btn" onclick="cerrarModal()">✕</button></div></div>
    <div class="m-cuerpo">${telefono((CL_EJEMPLO||{}).nombre||'Clienta', txt)}
    <div class="aviso mt"><span class="em">✦</span><div>Poné tu propio número para probarlo en tu teléfono antes de mandarlo a todas.</div></div>
    <label class="cpo" style="margin-top:12px"><span>Mi número</span><input id="mi-tel" placeholder="099 000 000"></label></div>

    <button class="btn wa" onclick="WhatsApp.abrir((document.getElementById(&#39;mi-tel&#39;)||{}).value, window._pruebaTxt)">Mandármelo</button></div>`,'angosto');

function armarCampania(seg, pl){
  ir('marketing','whatsapp');
  ESTADO.filtros.seg=seg; ESTADO.filtros.pl=pl;
  render(); window.scrollTo({top:0});
}
function crearCampania(){
  const seg = ESTADO.filtros.seg||'dormidas';
  const texto = ($('#wa-texto')||{}).value || '';
  const nombre = ($('#wa-nombre')||{}).value || 'Campaña sin nombre';
  const lista = clientasDe(seg).filter(c=>c.optin || seg==='todas');
  if(!lista.length){ toast('Ese segmento no tiene clientas'); return; }
  const c = Store.upsert('campanas', {nombre, fecha:hoyISO(), segmento:segmento(seg).nombre, segId:seg,
    texto, cupon:ESTADO.filtros.cupon||'', plantilla:ESTADO.filtros.pl, estado:'En curso',
    destinatarias:lista.length, enviadas:0, ventas:0, monto:0, enviadasA:[], ids:lista.map(x=>x.id), notas:''});
  toast('Campaña creada: '+lista.length+' clientas');
  panelEnvio(c.id);
}
/* envío asistido: un clic por clienta, abre WhatsApp con el texto pronto */
function panelEnvio(id){
  const c = Store.get('campanas',id); if(!c) return;
  const ids = c.ids || clientasDe(c.segId||'optin').map(x=>x.id);
  const texto = c.texto || (Store.get('plantillas',c.plantilla)||{}).texto || '';
  const hechas = c.enviadasA||[];
  const avance = ids.length? Math.round(hechas.length/ids.length*100):0;
  abrirModal(`
    <div class="m-cab"><div><h3>${esc(c.nombre)}</h3>
      <div class="sub">${esc(c.segmento)} · ${ids.length} clientas · ${esc(c.estado)}</div></div>
      <div class="x"><button class="ico-btn" onclick="cerrarModal()">✕</button></div></div>
    <div class="m-cuerpo">
      <div class="grid g2" style="gap:14px;align-items:start">
        <div>
          <div class="barra oliva" style="height:10px"><i style="width:${avance}%"></i></div>
          <div class="mini" style="margin:6px 0 14px"><b>${hechas.length}</b> de ${ids.length} enviados · faltan ${ids.length-hechas.length}</div>
          <div style="max-height:46vh;overflow:auto;padding-right:4px">
          ${ids.map(cid=>{ const cl=clienta(cid); if(!cl) return '';
            const listo = hechas.includes(cid);
            const msg = aplicarPlantilla(texto, cl, {cupon:c.cupon});
            return `<div class="envio-fila ${listo?'listo':''}" id="ef_${cid}">
              <span class="avatar ${colorTexto(cl.nombre.length)}" style="width:32px;height:32px;font-size:13px">${inicial(cl.nombre)}</span>
              <div class="txt"><b>${esc(cl.nombre)}</b><span>${esc(cl.tel)}${cl.talle?' · talle '+esc(cl.talle):''}</span></div>
              ${listo? '<span class="chip ok">enviado ✓</span>'
                : `<button class="btn chico wa" onclick="enviarUno('${id}','${cid}')">Abrir WhatsApp</button>`}
            </div>`;}).join('')}
          </div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn sec chico" onclick="marcarTodas('${id}')">Marcar todas como enviadas</button>
            ${c.estado!=='Terminada'?`<button class="btn chico" onclick="cerrarCampania('${id}')">Dar la campaña por terminada</button>`:''}
          </div>
        </div>
        <div>
          ${telefono(clienteNom(ids[0])||'Clienta', aplicarPlantilla(texto, clienta(ids[0]), {cupon:c.cupon}))}
          <div class="aviso" style="margin-top:14px"><span class="em">✦</span><div>
            Cada botón abre tu WhatsApp con el mensaje ya escrito y el número puesto: solo tocás «enviar».
            Funciona igual desde el celular y desde la computadora (WhatsApp Web).</div></div>
          ${c.estado==='Terminada'?`<div class="aviso ok" style="margin-top:10px"><span class="em">✓</span><div>
            Resultado: <b>${c.ventas} ventas</b> por ${money(c.monto)}.</div></div>`:''}
        </div>
      </div>
    </div>
    <div class="m-pie"><button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>`,'ancho');
}
function enviarUno(campId, cid){
  const c = Store.get('campanas',campId), cl = clienta(cid);
  const texto = aplicarPlantilla(c.texto||(Store.get('plantillas',c.plantilla)||{}).texto, cl, {cupon:c.cupon});
  WhatsApp.abrir(cl.tel, texto);
  c.enviadasA = c.enviadasA||[]; if(!c.enviadasA.includes(cid)) c.enviadasA.push(cid);
  c.enviadas = c.enviadasA.length; Store.upsert('campanas', c);
  panelEnvio(campId);
}
function marcarTodas(id){
  const c = Store.get('campanas',id);
  c.enviadasA = (c.ids||[]).slice(); c.enviadas=c.enviadasA.length; Store.upsert('campanas',c);
  toast('Marcadas como enviadas'); panelEnvio(id);
}
function cerrarCampania(id){
  const c = Store.get('campanas',id);
  c.estado='Terminada'; c.destinatarias=(c.ids||[]).length; Store.upsert('campanas',c);
  toast('Campaña terminada'); cerrarModal(); render();
}

/* formulario genérico: se le pasan los campos y arma la ventana solo */
function formGen(o){
  const v = o.val||{};
  const campo = c=>{
    const val = v[c.k]!==undefined? v[c.k] : (c.def!==undefined?c.def:'');
    const id = 'f_'+c.k;
    let inp;
    if(c.t==='select') inp = `<select id="${id}"${c.onchange?' onchange="'+esc(c.onchange)+'"':''}>${(c.op||[]).map(x=>{
        const [vv,ll] = Array.isArray(x)?x:[x,x];
        return `<option value="${esc(vv)}" ${String(vv)===String(val)?'selected':''}>${esc(ll)}</option>`;}).join('')}</select>`;
    else if(c.t==='textarea') inp = `<textarea id="${id}" ${c.ph?`placeholder="${esc(c.ph)}"`:''}>${esc(val)}</textarea>`;
    else if(c.t==='check') inp = `<label style="display:flex;gap:8px;align-items:center;font-size:14px;padding:9px 0">
        <input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(c.txt||'')}</label>`;
    else if(c.t==='chips') inp = `<div class="chips" id="${id}_box">${(c.op||[]).map(x=>
        `<button type="button" class="chip ${(val||[]).includes(x)?'vip':'linea'}"
          onclick="this.classList.toggle('vip');this.classList.toggle('linea')" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
    else inp = `<input id="${id}" type="${c.t||'text'}" value="${esc(val)}" ${c.ph?`placeholder="${esc(c.ph)}"`:''} ${c.step?`step="${c.step}"`:''}>`;
    return `<label class="cpo" style="grid-column:span ${c.ancho||1}">
      ${c.t==='check'?'':`<span>${esc(c.l)}</span>`}${inp}</label>`;
  };
  abrirModal(`
    <div class="m-cab"><div><h3>${esc(o.tit)}</h3>${o.sub?`<div class="sub">${esc(o.sub)}</div>`:''}</div>
      <div class="x"><button class="ico-btn" onclick="cerrarModal()">✕</button></div></div>
    <div class="m-cuerpo">
      ${o.aviso?`<div class="aviso" style="margin-bottom:14px"><span class="em">✦</span><div>${o.aviso}</div></div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">${(o.campos||[]).map(campo).join('')}</div>
      ${o.extra||''}
    </div>
    <div class="m-pie">
      ${o.borrar?`<button class="btn sec izq" style="color:var(--mal)" onclick="${o.borrar}">Eliminar</button>`:''}
      <button class="btn sec" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" onclick="_guardarForm()">${esc(o.btn||'Guardar')}</button>
    </div>`, o.clase||'');
  window._guardarForm = ()=>{
    const d = {};
    (o.campos||[]).forEach(c=>{
      const e = document.getElementById('f_'+c.k);
      if(c.t==='chips'){ d[c.k] = $$('#f_'+c.k+'_box .chip.vip').map(b=>b.dataset.v); }
      else if(!e) return;
      else if(c.t==='check') d[c.k]=e.checked;
      else if(c.t==='number') d[c.k]=+e.value;
      else d[c.k]=e.value;
    });
    if(o.guardar(d)!==false){ cerrarModal(); render(); }
  };
}

function agregarItem(){
  const id = $('#v_prod').value, cant = +$('#v_cant').value||1, desc = +$('#v_desc').value||0;
  const p = prod(id); if(!p.id) return;
  VENTA.items.push({prod:id, cant, precio:p.precio, desc, sub: Math.round(p.precio*cant*(1-desc/100))});
  $('#v_cant').value=1; $('#v_desc').value=0; pintarItems();
}
function quitarItem(i){ VENTA.items.splice(i,1); pintarItems(); }
function pintarItems(){
  const t = suma(VENTA.items, i=>i.sub);
  $('#v_items').innerHTML = VENTA.items.length? `<div class="lista">${VENTA.items.map((i,n)=>{
    const p=prod(i.prod);
    return `<div class="it">${fotoProd(p)}<div class="txt"><b>${esc(p.nombre)}</b>
      <span>talle ${esc(p.talle)} · ${esc(p.color)} · ${i.cant} × ${money(i.precio)}${i.desc?` · ${i.desc}% off`:''}</span></div>
      <div class="fin"><b>${money(i.sub)}</b></div>
      <button class="ico-btn" onclick="quitarItem(${n})">✕</button></div>`;}).join('')}</div>`
    : `<div class="vacio" style="padding:20px">Todavía no agregaste ninguna prenda</div>`;
  $('#v_total').textContent = money(t);
}
function guardarVenta(){
  if(!VENTA.items.length){ toast('Agregá al menos una prenda'); return; }
  const nom = $('#v_cli').value.trim();
  let cid = '';
  if(nom){
    const ex = Store.all('clientas').find(c=>c.nombre.toLowerCase()===nom.toLowerCase());
    if(ex) cid = ex.id;
    else { const n = Store.upsert('clientas',{nombre:nom, tel:'', ciudad:'Rivera', etiquetas:[], optin:false,
      alta:hoyISO(), colores:[], notas:'Se creó al cargar una venta'}); cid=n.id; toast('Clienta nueva creada'); }
  }
  const medio = $('#v_medio').value, total = suma(VENTA.items,i=>i.sub);
  const facturada = $('#v_fact').checked;
  const v = Store.upsert('ventas', {tienda:ESTADO.tienda, nro: 1000+Store.all('ventas').length+1, fecha:hoyISO(),
    hora: String(hoy().getHours()).padStart(2,'0')+':'+String(hoy().getMinutes()).padStart(2,'0'),
    local:$('#v_local').value, canal:$('#v_canal').value, vend:$('#v_vend').value, clienta:cid,
    items:VENTA.items, total, medio, facturada, factNro: facturada? (($('#v_factnro')||{}).value||'') : '',
    estado: medio==='Fiado'?'Fiada':'Cobrada', saldo: medio==='Fiado'?total:0,
    origen:'', origenTipo:'', notas:$('#v_notas').value});
  // descontar del stock del local donde se vendió
  VENTA.items.forEach(i=>{ const p=prod(i.prod); if(p.stk && p.stk[v.local]!==undefined){
    p.stk[v.local] = Math.max(0, p.stk[v.local]-i.cant); Store.upsert('productos',p); }});
  Store.guardar(); cerrarModal(); render(); toast('Venta guardada · '+money(total));
}

function formTraslado(prodId){
  const ps = T('productos').filter(p=>p.activo);
  if(!ps.length){ toast('No hay artículos'); return; }
  const destinos = LOCALES.map(l=>[l.id, tiendaNom(l.tienda)+' — '+l.nombre + (l.tienda===ESTADO.tienda?'':'  (otra tienda)')]);
  formGen({tit:'Mover mercadería', sub:'Sale de un lado y entra en el otro. Puede ser a la otra tienda.',
    aviso:'Si el destino es <b>'+esc(otraTienda().nombre)+'</b>, el artículo se da de alta allá con esas unidades y le queda el aviso a la encargada.',
    val:{prod:prodId||ps[0].id, cant:1, desde:locales()[0].id, hasta:locales()[1]?locales()[1].id:locales()[0].id},
    campos:[
      {k:'prod', l:'Artículo', t:'select', ancho:2, op:ps.map(p=>[p.id, p.nombre+' · talle '+p.talle+' · '+p.color+' ('+locales().map(l=>l.corto+' '+(p.stk[l.id]||0)).join(' / ')+')'])},
      {k:'desde', l:'Sale de', t:'select', op:locales().map(l=>[l.id,l.nombre])},
      {k:'hasta', l:'Va a', t:'select', op:destinos},
      {k:'cant', l:'Cantidad', t:'number'},
      {k:'motivo', l:'Motivo', ph:'La clienta lo pidió en el otro local'}
    ],
    guardar(d){
      if(d.desde===d.hasta){ toast('Elegí dos lugares distintos'); return false; }
      const p = prod(d.prod);
      if((p.stk[d.desde]||0) < d.cant){ toast('No hay tantas unidades en '+localCorto(d.desde)); return false; }
      const tDestino = tiendaDeLocal(d.hasta);
      p.stk[d.desde] -= d.cant; Store.upsert('productos', p);
      if(tDestino===p.tienda){
        p.stk[d.hasta] = (p.stk[d.hasta]||0) + d.cant; Store.upsert('productos', p);
      } else {
        // el artículo pasa a la otra tienda: si no lo tiene, se le crea
        let dest = Store.all('productos').find(x=>x.tienda===tDestino && x.nombre===p.nombre && x.talle===p.talle && x.color===p.color);
        if(!dest){
          dest = Store.upsert('productos', {tienda:tDestino, nombre:p.nombre, cat:p.cat,
            coleccion:(COLS[tDestino]||[])[3]||p.coleccion, temporada:p.temporada, color:p.color, talle:p.talle,
            costo:p.costo, precio:p.precio, min:p.min||2, prov:p.prov, activo:true, alta:hoyISO(),
            cod:tDestino+'-'+(Store.all('productos').filter(x=>x.tienda===tDestino).length+1), stk:{}});
        }
        dest.stk[d.hasta] = (dest.stk[d.hasta]||0) + d.cant; Store.upsert('productos', dest);
        nuevoAviso(tDestino, 'Llegaron '+d.cant+' × '+p.nombre+' (talle '+p.talle+') desde '+tienda().nombre);
      }
      Store.upsert('movStock', {tienda:ESTADO.tienda, fecha:hoyISO(), prod:d.prod, cant:d.cant, desde:d.desde, hasta:d.hasta,
        tipo: tDestino===p.tienda ? 'Traslado' : 'Traslado entre tiendas', motivo:d.motivo||'—',
        user:ESTADO.usuario.id, tiendaDestino:tDestino});
      toast(tDestino===p.tienda? 'Traslado registrado' : 'Enviado a '+tiendaNom(tDestino));
      pintarEncabezado();
    }});
}

/* ══════════════ EXPORTAR A EXCEL (CSV que Excel abre directo) ══════════════ */
async function descargarCSV(nombre, filas){
  const txt = '﻿' + filas.map(f=>f.map(c=>{
    const s = String(c==null?'':c).replace(/"/g,'""');
    return /[;"\n]/.test(s) ? '"'+s+'"' : s;
  }).join(';')).join('\r\n') + '\r\n\r\nFlor de Ceibo — generado por Wydan Solutions';
  const archivo = nombre+'_'+hoyISO()+'.csv';
  // dentro del visor de claude.ai hay que pedirle al visor que guarde el archivo
  try{
    if(window.claude && typeof claude.use==='function'){
      const d = await claude.use('downloads');
      if(d){ await d.save({filename:archivo, data:txt}); toast('Archivo descargado'); return; }
    }
  }catch(e){ if(e && e.code==='declined') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download = archivo; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Archivo descargado');
}

  ESTADO.usuario = null;
  $('#app').classList.add('oculto');
  $('#ingreso').classList.add('oculto');
  $('#elegir').classList.remove('oculto');
  pintarTiendas();
}
/* cambiar de tienda sin salir del sistema (solo la dueña) */
function saltarATienda(id){
  ESTADO.tienda = id; ESTADO.local = 'TODOS'; ESTADO.vista='panel'; ESTADO.sub=''; ESTADO.filtros={};
  aplicarTema(id); cerrarModal(); pintarEncabezado(); render();
  toast('Estás en '+tiendaNom(id));
}
function pintarEncabezado(){
  const t = tienda();
  $('#top-marca').innerHTML = logoHTML(t.id,'logo') +
    `<div class="txt"><b>${esc(t.nombre)}</b><span>${esc(t.sub)}</span></div>`;
  $('#btn-tienda-txt').textContent = otraTienda().nombre;
  $('#sel-local').innerHTML = `<option value="TODOS">Toda la tienda</option>` +
    locales().map(l=>`<option value="${l.id}" ${ESTADO.local===l.id?'selected':''}>${esc(l.nombre)}</option>`).join('');
  const sinLeer = T('avisos').filter(a=>!a.leido).length;
  $('#campana').innerHTML = '✉' + (sinLeer? `<span class="cuenta">${sinLeer}</span>`:'');
  // la dueña salta de una tienda a la otra; las empleadas vuelven al inicio
  $('#btn-tienda').onclick = ()=> ESTADO.usuario && !ESTADO.usuario.tienda ? saltarATienda(otraTienda().id) : volverAElegir();
}

/* ══════════ avisos entre tiendas ══════════ */
function nuevoAviso(tiendaDestino, texto){
  Store.upsert('avisos', {tienda:tiendaDestino, texto, fecha:hoyISO(),
    hora:String(hoy().getHours()).padStart(2,'0')+':'+String(hoy().getMinutes()).padStart(2,'0'), leido:false});
}
function verAvisos(){
  const av = T('avisos').sort((a,b)=>(a.fecha+a.hora)<(b.fecha+b.hora)?1:-1);
  abrirModal(`<div class="m-cab"><div><h3>Avisos de ${esc(tienda().nombre)}</h3>
      <div class="sub">Lo que pasó en la tienda y lo que llegó de la otra</div></div>
      <div class="x"><button class="ico-btn" onclick="cerrarModal()">✕</button></div></div>
    <div class="m-cuerpo">
      ${av.length? av.map(a=>`<div class="aviso-fila ${a.leido?'':'nuevo'}">
        <span class="pun" style="background:${a.leido?'var(--tinta-3)':'var(--ceibo)'};margin-top:6px"></span>
        <div style="flex:1"><b>${esc(a.texto)}</b>
          <div class="mini">${dmy(a.fecha)} · ${esc(a.hora)}</div></div></div>`).join('')
        : vacio('No hay avisos','✓')}
    </div>
    <div class="m-pie">
      ${av.some(a=>!a.leido)?`<button class="btn sec izq" onclick="marcarAvisos()">Marcar todo como leído</button>`:''}
      <button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>`,'angosto');
}
function marcarAvisos(){
  T('avisos').forEach(a=>{ a.leido=true; Store.upsert('avisos',a); });
  cerrarModal(); pintarEncabezado(); toast('Avisos leídos');
}

function menuUsuario(){
  const puedeCambiar = ESTADO.usuario && !ESTADO.usuario.tienda;
  abrirModal(`<div class="m-cab"><div><h3>${esc(ESTADO.usuario.nombre)}</h3>
      <div class="sub">${esc(ESTADO.usuario.rol)} · ${esc(tienda().nombre)}${ESTADO.usuario.local?' · '+localNom(ESTADO.usuario.local):''}</div></div>
      <div class="x"><button class="ico-btn" onclick="cerrarModal()">✕</button></div></div>
    <div class="m-cuerpo">
      <div class="aviso"><span class="em">◐</span><div>Estás viendo la página como <b>${esc(ESTADO.usuario.rol)}</b>.
        Probá entrar como otra persona para ver cómo cambia lo que se muestra.</div></div>
      ${puedeCambiar?`<div class="etiqueta" style="margin:16px 0 8px">Cambiar de tienda</div>
        <div class="lista">${TIENDAS.map(t=>`<div class="it">
          <span class="pun" style="background:${t.id==='FDC'?'#A0531E':'#DE8C7C'}"></span>
          <div class="txt"><b>${esc(t.nombre)}</b><span>${esc(t.dir)}</span></div>
          <div class="fin">${t.id===ESTADO.tienda?'<span class="chip ok">acá estás</span>'
            :`<button class="btn chico sec" onclick="saltarATienda('${t.id}')">Ir</button>`}</div></div>`).join('')}</div>`:''}
      <div class="etiqueta" style="margin:16px 0 8px">Quién entra</div>
      <div class="lista">
        ${T('usuarios').map(u=>`<div class="it">
          <span class="avatar ${colorTexto(u.nombre.length)}">${inicial(u.nombre)}</span>
          <div class="txt"><b>${esc(u.nombre)}</b><span>${esc(u.rol)}${u.local?' · '+localNom(u.local):' · las dos tiendas'}</span></div>
          <div class="fin">${u.id===ESTADO.usuario.id?'<span class="chip ok">vos</span>'
            :`<button class="btn chico sec" onclick="entrar('${u.id}')">Entrar como ella</button>`}</div></div>`).join('')}
      </div></div>
    <div class="m-pie"><button class="btn sec izq" onclick="salir()">Cerrar sesión</button>
      <button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>`,'angosto');
}
function entrar(id){
  const u = usuario(id); ESTADO.usuario = u;
  if(u.tienda && u.tienda!==ESTADO.tienda){ ESTADO.tienda = u.tienda; aplicarTema(u.tienda); }
  ESTADO.local = 'TODOS';
  $('#elegir').classList.add('oculto');
  $('#ingreso').classList.add('oculto');
  $('#app').classList.remove('oculto');
  $('#u-nombre').textContent = u.nombre.split(' ')[0];
  $('#u-rol').textContent = u.rol;
  $('#u-avatar').textContent = inicial(u.nombre);
  $('#u-avatar').className = 'avatar '+colorTexto(u.nombre.length);
  pintarEncabezado();
  cerrarModal();
  if(!puede(ESTADO.vista)) ESTADO.vista='panel';
  render();
}
function salir(){
  cerrarModal(); ESTADO.usuario=null;
  $('#app').classList.add('oculto'); $('#ingreso').classList.add('oculto');
  $('#elegir').classList.remove('oculto'); pintarTiendas();
}
function reiniciarDemo(){
  if(!confirm('Esto borra todo lo que cargaste y vuelve a los datos de ejemplo. ¿Seguimos?')) return;
  Repo.borrar(); DB = generarHistorial(semilla()); Repo.guardar(DB);
  toast('Demostración reiniciada'); render();
}
function iniciar(){
  DB = Repo.leer();
  if(!DB || !DB.ventas || !DB.ventas.length){ DB = generarHistorial(semilla()); Repo.guardar(DB); }
  aplicarTema('FDC');
  pintarTiendas();
  if(window.Chart){
    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    Chart.defaults.font.size = 11.5;
    Chart.defaults.color = '#6B5C4F';
    Chart.defaults.plugins.tooltip.backgroundColor = '#2B2119';
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.plugins.tooltip.titleFont = {family:"'Inter'", weight:'600'};
  }
}
iniciar();

</script>
</body>
</html>
